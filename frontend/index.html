<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <title>Percisio Sense</title>
    <style>
      #app-shell {
        display: flex;
        height: 100vh;
        background: #f8fafc;
        font-family: 'Inter', sans-serif;
      }
      #shell-viewer {
        flex: 0 0 65%;
        background: #f1f5f9;
        border-right: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #shell-assistant {
        flex: 1;
        background: #ffffff;
        display: flex;
        flex-direction: column;
      }
      .shell-pulse {
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </head>
  <body>
    <div id="app-shell">
      <div id="shell-viewer">
        <div class="shell-pulse" style="width:200px;height:240px;background:#e2e8f0;border-radius:12px;"></div>
      </div>
      <div id="shell-assistant">
        <div style="height:48px;background:#f8fafc;border-bottom:1px solid #e2e8f0;"></div>
        <div style="flex:1;padding:24px;display:flex;flex-direction:column;gap:12px;">
          <div class="shell-pulse" style="height:14px;width:60%;background:#e2e8f0;border-radius:6px;"></div>
          <div class="shell-pulse" style="height:14px;width:80%;background:#e2e8f0;border-radius:6px;"></div>
          <div class="shell-pulse" style="height:14px;width:45%;background:#e2e8f0;border-radius:6px;"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
